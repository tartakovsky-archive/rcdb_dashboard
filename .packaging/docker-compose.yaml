version: '3.7'

x-env-vars: &env-vars
  DOCKER_IMAGE_NAME: ${DOCKER_IMAGE_NAME:-rcdb/execution}
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  SENTRY_DSN: ${SENTRY_DSN}
  KAIKO_API_KEY: ${KAIKO_API_KEY}

services:
  db:
    image: postgres:11-alpine
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: 'trust'
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - 5432:5432

  migration:
    image: ${DOCKER_IMAGE_NAME}
    restart: "no"
    environment:
      <<: *env-vars
    command: python manage.py migrate
    volumes:
      - data:/app/data
    depends_on:
      - db
    logging:
      driver: gcplogs

  web:
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    environment:
      <<: *env-vars
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - migration
    ports:
      - 16458:8000
    volumes:
      - data:/app/data
    logging:
      driver: gcplogs

  consolidate_ticks:
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    environment:
      <<: *env-vars
      KAIKO_API_KEY: ${KAIKO_API_KEY}
    volumes:
      - data:/app/data
    command: python manage.py consolidate_ticks
    depends_on:
      - db
      - migration
    logging:
      driver: gcplogs

  consolidate_custom:
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    environment:
      <<: *env-vars
    volumes:
      - data:/app/data
    command: python manage.py consolidate_custom
    depends_on:
      - db
      - migration
    logging:
      driver: gcplogs

  execute_target:
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    environment:
      <<: *env-vars
    command: python manage.py execute_target
    depends_on:
      - db
      - migration
    logging:
      driver: gcplogs

  run_bot:
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    environment:
      <<:  *env-vars
    command: ./manage.py run_bot
    depends_on:
      - db
      - migration
    volumes:
      - data:/app/data
    logging:
      driver: gcplogs

volumes:
  db:
  data:
