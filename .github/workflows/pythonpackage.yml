name: Python tests

on: [push]

jobs:
  build:
    env:
      TEST_ENV: True
      BITFINEX_KEY: ${{ secrets.BITFINEX_KEY }}
      BITFINEX_SECRET: ${{ secrets.BITFINEX_SECRET }}
      BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
      BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.7]

    steps:
    - uses: actions/checkout@master
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==20.1
        pip install -r requirements.txt
        mkdir _req_install
        cp install_github.sh _req_install/
        cp requirements.github _req_install/
        cp requirements.research.github _req_install/
        cd _req_install
        chmod 0755 install_github.sh
        export GITHUB_TOKEN=${{ secrets.RCDB_GITHUB_TOKEN }}
        /bin/bash install_github.sh requirements.github
        /bin/bash install_github.sh requirements.research.github
        cd ..
    - name: Tests
      run: pytest --ignore tests/test_base_flow_unmocked.py
    - name: Tests [real exchanges]
      if: ${{ contains(github.ref, 'dev') }}
      run: pytest tests/test_base_flow_unmocked.py
