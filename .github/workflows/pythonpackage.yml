name: Python tests

on: [push]

jobs:
  build:
    env:
      TEST_ENV: True
      BITFINEX_KEY: ${{ secrets.BITFINEX_KEY }}
      BITFINEX_SECRET: ${{ secrets.BITFINEX_SECRET }}
      BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
      BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.7]

    steps:
    - uses: actions/checkout@master
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: /bin/bash install_deps.sh
    - name: Tests
      run: pytest --ignore tests/test_base_flow_unmocked.py
    - name: Tests [real exchanges]
      if: ${{ contains(github.ref, 'dev') }}
      run: pytest tests/test_base_flow_unmocked.py
