name: Deploy

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
        with:
          token: ${{ secrets.GH_TOKEN }}
          submodules: true

      - uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip3 install awscli docker-compose

      - name: Build & push images
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
        run: |
          mkdir .ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > .ssh/gh_rsa
          docker-compose build web nginx
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }}  | docker login --username AWS --password-stdin ${{ secrets.DOCKER_REGISTRY }}
          docker-compose push web nginx

      - name: Remove rcdb_commons/.git
        run: rm -rf rcdb_commons/.git

      - name: Set .env
        run: |
          python -c "print($(curl --location --request GET '${{ secrets.CREDENTIAL_STORE_ITEM_URL }}' --header 'Authorization: Bearer ${{ secrets.CREDENTIALSTORE_TOKEN }}')['fields'][0]['value'])" > .env

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        env:
          KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
        with:
          source: "*"
          target: "/home/ubuntu/dashboard"

      - name: Up app
        uses: appleboy/ssh-action@master
        env:
          KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
        with:
          script: |
            cd /home/ubuntu/dashboard && \
            echo "dir changed" && \
            chmod +x deploy.sh && \
            ./deploy.sh --migrate
