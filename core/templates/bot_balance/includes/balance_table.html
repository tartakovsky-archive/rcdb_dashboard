<table class="table table-bordered table-sm">
    <tr>
        <th colspan="3">{{ type|upper }}</th>
    </tr>
    <tr>
        <th>Symbol</th>
        <th>Amount</th>
        <th>Amount, $</th>
    </tr>
    {% for sym_data in balances %}
        <tr>
            <td>{{ sym_data.symbol }}</td>
            <td>{{ sym_data.amount }}</td>
            <td>{{ sym_data.amount_usd|floatformat:3 }}</td>
        </tr>
    {% endfor %}
</table>
