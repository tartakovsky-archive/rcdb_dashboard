version: '3.7'

x-env-vars: &env-vars
  ENV: ${ENV:-PROD}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-db_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-db}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
  SENTRY_DSN: ${SENTRY_DSN}
  DATASTORE_URL: ${DATASTORE_URL}
  DATASTORE_TOKEN: ${DATASTORE_TOKEN}
  CREDENTIALSTORE_URL: ${CREDENTIALSTORE_URL}
  CREDENTIALSTORE_TOKEN: ${CREDENTIALSTORE_TOKEN}
  CREDENTIALSTORE_VAULT: ${CREDENTIALSTORE_VAULT}

services:
  nginx:
    image: ${DOCKER_REGISTRY:-local}/dashboard-nginx:latest
    build:
      context: ./.packaging/nginx
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "512m"
        max-file: "2"
    ports:
      - 80:80
    volumes:
      - static-content:/static
    depends_on:
      - web

  web:
    image: ${DOCKER_REGISTRY:-local}/dashboard:latest
    build:
      context: ./
      dockerfile: ./.packaging/Dockerfile
    environment:
      <<: *env-vars
    command: gunicorn -k uvicorn.workers.UvicornWorker --workers=3 --threads=2 --max-requests=10 --timeout=60 --enable-stdio-inheritance --access-logfile - --access-logformat "[%(t)s] [ACCESS] %(h)s - %(r)s %(s)s %(T)s" --log-level DEBUG --graceful-timeout=30 -b 0.0.0.0:8080 rcdb_execution.asgi:application
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "2"
    volumes:
      - static-content:/app/static
    depends_on:
      - db
      - redis

  celery_workers:
    image: ${DOCKER_REGISTRY:-local}/dashboard:latest
    build:
      context: ./
      dockerfile: ./.packaging/Dockerfile
    environment:
      <<: *env-vars
    command: celery -A rcdb_execution.celery.celery worker -l info -c 5 -E --max-tasks-per-child 5 -Q ${CELERY_QUEUE:-default}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "512m"
        max-file: "2"
    depends_on:
      - db
      - redis

  celery_beat:
    image: ${DOCKER_REGISTRY:-local}/dashboard:latest
    build:
      context: ./
      dockerfile: ./.packaging/Dockerfile
    environment:
      <<: *env-vars
    command: celery -A rcdb_execution.celery.celery beat -l info
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "512m"
        max-file: "2"
    depends_on:
      - db
      - redis

  db:
    image: postgres:12-alpine
    environment:
      <<: *env-vars
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    ports:
    - 5433:5432
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "2"

  redis:
    image: redis:6.2-buster
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "512m"
        max-file: "2"

volumes:
  db_data:
  redis_data:
  static-content:
